name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: -C link-arg=/STACK:8388608
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set release version
        shell: pwsh
        run: node .github/scripts/set-release-version.mjs "${env:RELEASE_TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.7

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: release-${{ matrix.target }}
          cache-targets: false

      - name: Prepare MSI version
        shell: pwsh
        run: node .github/scripts/prepare-msi-config.mjs "${env:RELEASE_TAG}" src-tauri/tauri.msi-version.conf.json

      - name: Build Windows installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "DBX ${{ inputs.release_tag || github.ref_name }}"
          releaseDraft: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.no-updater.conf.json --config src-tauri/tauri.msi-version.conf.json --bundles nsis,msi

      - name: Verify Windows bundles
        shell: pwsh
        run: |
          $bundleRoot = "target/${{ matrix.target }}/release/bundle"
          $nsisInstallers = @(Get-ChildItem (Join-Path $bundleRoot "nsis") -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          $msiInstallers = @(Get-ChildItem (Join-Path $bundleRoot "msi") -Filter "*.msi" -File -ErrorAction SilentlyContinue)
          if ($nsisInstallers.Count -eq 0) { throw "No NSIS installer was produced for ${{ matrix.target }}" }
          if ($msiInstallers.Count -eq 0) { throw "No MSI installer was produced for ${{ matrix.target }}" }

      # tauri build embeds the frontend via custom-protocol, so the raw binary
      # runs standalone (WebView2 runtime is still required on the target PC).
      - name: Prepare portable executable
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/dbx.exe"
          if (-not (Test-Path $exe)) { throw "Missing portable executable: $exe" }
          Copy-Item $exe "dbx-lite-${{ matrix.arch }}.exe"

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: dbx-lite-windows-${{ matrix.arch }}
          path: dbx-lite-${{ matrix.arch }}.exe
          if-no-files-found: error

      - name: Attach portable executable to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: DBX ${{ env.RELEASE_TAG }}
          draft: true
          files: dbx-lite-${{ matrix.arch }}.exe
          fail_on_unmatched_files: true