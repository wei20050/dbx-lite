name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set release version
        run: node .github/scripts/set-release-version.mjs "$RELEASE_TAG"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: macos-${{ matrix.target }}
          cache-targets: false

      # "-" makes Tauri sign the .app ad hoc. Without it the bundle may be
      # unsigned, which cannot launch on Apple Silicon at all.
      # Ad-hoc builds are for internal testing: Gatekeeper still requires
      # users to open with right-click -> Open.
      - name: Build .app bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app

      - name: Verify ad-hoc signature
        run: |
          APP="target/${{ matrix.target }}/release/bundle/macos/dbx-lite.app"
          test -d "$APP" || { echo "Missing app bundle: $APP"; exit 1; }
          codesign --verify --deep "$APP"
          codesign -dvvv "$APP" 2>&1

      # ditto preserves macOS metadata and symlinks; the resulting zip is the
      # single downloadable file for one architecture.
      - name: Archive app bundle
        run: |
          cd target/${{ matrix.target }}/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent dbx-lite.app dbx-lite-${{ matrix.arch }}.app.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbx-lite-macos-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/macos/dbx-lite-${{ matrix.arch }}.app.zip
          if-no-files-found: error

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: DBX ${{ env.RELEASE_TAG }}
          draft: true
          files: target/${{ matrix.target }}/release/bundle/macos/dbx-lite-${{ matrix.arch }}.app.zip
          fail_on_unmatched_files: true
