name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set release version
        run: node .github/scripts/set-release-version.mjs "$RELEASE_TAG"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfontconfig1-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: linux-${{ matrix.target }}
          cache-targets: false

      # AppImage is the single-file runnable bundle; deb is provided as an
      # installable alternative. Both are built natively on their own runner.
      - name: Build Linux bundles
        run: pnpm tauri build --target ${{ matrix.target }} --bundles deb,appimage

      - name: Verify Linux bundles
        run: |
          BUNDLE_ROOT="target/${{ matrix.target }}/release/bundle"
          ls -l "$BUNDLE_ROOT/deb"
          ls -l "$BUNDLE_ROOT/appimage"
          test -n "$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage' -print -quit)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbx-lite-linux-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: DBX ${{ env.RELEASE_TAG }}
          draft: true
          files: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: true
